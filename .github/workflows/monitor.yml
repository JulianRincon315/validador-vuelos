name: Panama Stopover Price Monitor

on:
  schedule:
    # 03:00 AM y 02:00 PM hora de Colombia (UTC-5) -> 08:00 y 19:00 UTC
    - cron: '0 8,19 * * *'
  workflow_dispatch: # Permite ejecución manual cuando desees

jobs:
  check-flight-prices:
    name: Consulta y Notificación de Tarifas
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11 con caché
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Instalar librerías del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Instalar Chromium y dependencias de Playwright
        run: |
          playwright install --with-deps chromium

      - name: 5. Ejecutar monitor de vuelos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          DATADOME_COOKIE: ${{ secrets.DATADOME_COOKIE }}
        run: |
          python tracker.py

      - name: 6. Respaldar ambas capturas de pantalla en artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-vuelos-resultado
          path: |
            resultadostopover.png
            resultadogoogleflights.png
          if-no-files-found: ignore
          retention-days: 7
