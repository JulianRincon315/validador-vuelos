name: Panama Stopover Price Monitor

on:
  schedule:
    # 08:00 AM hora de Colombia (UTC-5) -> 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  check-price:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegadores de Playwright con dependencias
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar Tracker de Vuelos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py

      - name: Guardar captura como artefacto (opcional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-resultado
          path: copa_resultado.png
          retention-days: 7
